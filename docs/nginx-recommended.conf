# Recommended nginx reverse proxy config for GoFileBeam
#
# Header ownership
# -----------------
# GoFileBeam sets its own security headers (X-Content-Type-Options,
# X-Frame-Options, X-XSS-Protection, Content-Security-Policy) in the Go app
# itself (cmd/gofilebeam/main.go). Do NOT set these same headers again here.
# Setting them in both places was observed in production sending duplicate,
# conflicting values to the browser (e.g. X-Frame-Options: DENY from the app
# alongside X-Frame-Options: SAMEORIGIN from nginx). If you need a different
# policy than the app's defaults, change it in the app config, not here.
#
# If you are instead running behind Cloudflare in front of nginx, Cloudflare
# itself may also inject informational headers (e.g. NEL/Report-To, alt-svc,
# cf-cache-status) - those are unrelated to the app's security headers and
# are fine to leave as-is.
#
# Client IP propagation
# ----------------------
# GoFileBeam's brute-force protection and rate limiting key on client IP.
# It prefers, in order: CF-Connecting-IP, X-Forwarded-For, X-Real-IP, then
# falls back to the raw TCP peer address. For IP-based protections to work
# correctly:
#   - If using Cloudflare, make sure Cloudflare's real IP module is active
#     (it sets CF-Connecting-IP automatically) and that nginx forwards it
#     unmodified.
#   - Always set X-Forwarded-For to $proxy_add_x_forwarded_for (appends to,
#     rather than blindly trusting, any client-supplied value) so the app
#     sees a proxy-controlled chain rather than an attacker-spoofed one.
#   - Do not let untrusted clients reach the app directly on its listening
#     port; only nginx/Cloudflare should have network access to it.
#
# Upload size and timeouts
# -------------------------
# The app enforces its own GOFILEBEAM_MAX_FILE_SIZE_MB and
# GOFILEBEAM_MAX_STORAGE_GB limits, but nginx's own defaults will reject
# large uploads before they even reach the app unless raised. Likewise,
# proxy read/send timeouts need to be generous enough for slow uploads on
# large files - the app now streams uploads directly to disk, so the
# bottleneck under normal conditions is network throughput, not
# server-side buffering, but a slow client connection can still exceed
# nginx's default proxy timeouts on a large file.
#
# If you are behind Cloudflare, note that Cloudflare enforces its own hard
# per-request body size limit at the edge, independent of anything
# configured here or in the app: 100 MB on Free/Pro, 200 MB on Business,
# 500 MB on Enterprise (Enterprise-only beyond that). This limit cannot be
# raised by nginx config - requests over it are rejected by Cloudflare
# before nginx ever sees them. GoFileBeam's chunked upload protocol
# (/api/upload/init, /chunk, /complete - see README.md) exists specifically
# to work around this: each chunk is its own small request
# (GOFILEBEAM_CHUNK_SIZE_MB, default 8 MB) well under any of these limits,
# so files of any size can be uploaded in pieces regardless of your
# Cloudflare plan. client_max_body_size and the timeouts below should still
# be generous enough to comfortably cover the single-request legacy path
# (small files and multi-file ZIP uploads), which does not use chunking.

server {
    listen 443 ssl;
    server_name upfiles.example.com;

    # ... ssl_certificate / ssl_certificate_key / other TLS config ...

    # Must be >= GOFILEBEAM_MAX_FILE_SIZE_MB, plus some headroom for
    # multipart boundary/header overhead. Only relevant to the legacy
    # single-request upload path (small files, multi-file ZIP) - chunked
    # uploads never send a request anywhere near this size.
    client_max_body_size 200m;

    # Generous timeouts so large/slow uploads aren't cut off mid-transfer.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_body_timeout 300s;

    # Streaming uploads: don't force nginx to buffer the whole request body
    # before forwarding it to the app. This avoids adding nginx itself as a
    # second full-file buffering point on top of the app (which now streams
    # natively).
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Proxy-controlled client IP chain - do not let clients set this
        # directly; $proxy_add_x_forwarded_for appends the real peer IP to
        # any upstream value instead of blindly trusting client input.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Intentionally NOT setting X-Content-Type-Options, X-Frame-Options,
        # X-XSS-Protection, or Content-Security-Policy here - the app owns
        # these (see header ownership note above).
    }
}
